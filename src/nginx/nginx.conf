worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── 로그 ──────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    '$request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile    on;
    tcp_nopush  on;
    keepalive_timeout 65;

    # ── Rate Limiting ─────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=tiles:10m rate=200r/s;
    # 대량 수집(스크래핑) 억제: 다운로드/Export 전용 저속 존 + IP당 동시연결 제한
    limit_req_zone  $binary_remote_addr zone=download:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    # ── Gzip ──────────────────────────────────────────────
    gzip on;
    gzip_types application/json application/geo+json text/plain;
    gzip_min_length 1000;

    # ── Tile cache ────────────────────────────────────────
    proxy_cache_path /var/cache/nginx/tiles levels=1:2
                     keys_zone=tile_cache:10m max_size=1g inactive=1h;

    # ── Upstream ──────────────────────────────────────────
    upstream backend {
        server energy-hub-backend:8000;
    }

    upstream frontend {
        server energy-hub-frontend:5173;
    }

    upstream martin {
        server energy-hub-martin:3000;
    }

    server {
        listen 80;
        server_name _;

        # ── 보안 헤더 ────────────────────────────────────
        add_header X-Content-Type-Options    nosniff always;
        add_header X-Frame-Options           DENY always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # ── Health ────────────────────────────────────────
        location /health {
            proxy_pass http://backend;
        }

        # ── Terrain Tiles (로컬 PNG) ──────────────────────
        location /tiles/terrain/ {
            alias /data/terrain-tiles/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header Access-Control-Allow-Origin "*";
        }

        # ── Vector Tiles (Martin) — 보안 allowlist ────────
        #   UI(MapView/TwinMap)가 실제 쓰는 7개 레이어만 외부 노출. 그 외(tiger.*,
        #   research.*, ev_charger 원본/이력, /tiles/catalog 등)는 아래 catch-all 에서 404.
        location ~ ^/tiles/(pv_facility|substation|power_plant|power_line|road|landcover|ev_charger_latest)/ {
            limit_req zone=tiles burst=300 nodelay;
            limit_conn perip 32;          # IP당 동시 타일연결 상한(대량 하베스트 억제)

            rewrite ^/tiles/(.*)$ /$1 break;   # /tiles/ 접두 제거 후 martin 으로
            proxy_pass http://martin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Accept-Encoding "";
            proxy_read_timeout 120s;          # landcover 등 저줌 대용량 타일 콜드 생성 여유(이후 캐시)

            proxy_cache tile_cache;
            proxy_cache_valid 200 1h;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;
            add_header Access-Control-Allow-Origin "*";
            add_header Cache-Control "public, max-age=3600";
        }

        # 허용 외 모든 타일 경로 차단 (카탈로그·미사용/민감 레이어 노출 방지)
        location /tiles/ {
            return 404;
        }

        # ── 대량 다운로드/Export (스크래핑 억제: 저속 존 + 동시연결 3) ───
        #    경로: /api/v1/data/weather/download(-year), /api/v1/demand/export
        location ~ ^/api/v1/(data/weather/download|demand/export) {
            limit_req zone=download burst=10 nodelay;
            limit_conn perip 3;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
        }

        # ── 데이터센터 조회/미리보기 (스트리밍, 캐시 제외) ───
        location /api/v1/data/ {
            limit_req zone=api burst=100 nodelay;
            limit_conn perip 8;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;          # 대용량 다운로드 즉시 전달
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
        }

        # ── API v1 ───────────────────────────────────────
        location /api/v1/ {
            limit_req zone=api burst=100 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
        }

        # ── Docs ─────────────────────────────────────────
        location /docs {
            proxy_pass http://backend;
        }

        location /redoc {
            proxy_pass http://backend;
        }

        location /openapi.json {
            proxy_pass http://backend;
        }

        # ── Frontend (Vite dev) ────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_http_version 1.1;
        }
    }
}
